openapi: 3.2.0
info:
  description: lakeFS HTTP API
  title: lakeFS Health Check API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: /api/v1
  description: lakeFS server endpoint
security:
- jwt_token: []
- basic_auth: []
- cookie_auth: []
- oidc_auth: []
- saml_auth: []
tags:
- name: Health Check
paths:
  /healthcheck:
    get:
      operationId: healthCheck
      security: []
      tags:
      - Health Check
      description: check that the API server is up and running
      responses:
        204:
          description: NoContent
      summary: Health check
      x-summary-source: derived
components:
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
    jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookie_auth:
      type: apiKey
      in: cookie
      name: internal_auth_session
    oidc_auth:
      type: apiKey
      in: cookie
      name: oidc_auth_session
    saml_auth:
      type: apiKey
      in: cookie
      name: saml_auth_session
